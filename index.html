<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anivex Labs — Launching Soon</title>
  <link rel="icon" type="/assets/logo_croped.png" href="logo_croped.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Decorative Orbit Background -->
  <div class="orbit-ring"></div>

  <main class="countdown-container">
    
    <!-- Logo -->
    <img src="/assets/logo_croped.png" alt="Anivex Labs Logo" class="brand-logo" />

    <!-- Status Badge -->
    <div class="badge">
      <span class="badge-dot"></span>
      PRINTER FARM LAUNCHING SOON
    </div>

    <!-- Main Headings -->
    <h1 class="headline">
      shaping digital dreams<br />
      into high-precision<br />
      <span class="accent-text">physical reality.</span>
    </h1>

    <p class="subheadline">
      Anivex Labs is finalizing the setup. Order online and track your dispatch in real-time.
    </p>

    <!-- Timer Cards -->
    <div class="timer-grid">
      <div class="timer-card">
        <div class="timer-number" id="days">00</div>
        <div class="timer-label">DAYS</div>
      </div>
      <div class="timer-card">
        <div class="timer-number" id="hours">00</div>
        <div class="timer-label">HOURS</div>
      </div>
      <div class="timer-card">
        <div class="timer-number" id="minutes">00</div>
        <div class="timer-label">MINS</div>
      </div>
      <div class="timer-card">
        <div class="timer-number" id="seconds">00</div>
        <div class="timer-label">SECS</div>
      </div>
    </div>

    <!-- Action Section -->
    <div class="action-bar">
      <a href="mailto:contact@anivexlabs.com" class="btn btn-primary">NOTIFY ME</a>
      <a href="https://anivexlabs.com" class="btn btn-secondary">LEARN MORE</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
